<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CampusBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>
            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
            </div>
        </div>
    </header>

    <!-- MAIN REGISTER -->
    <main class="main-content py-5" style="background: var(--bg-main);">
        <div class="container">
            <div class="card p-4 mx-auto" style="max-width: 520px; box-shadow: var(--shadow-lg);">
                <div class="text-center mb-4">
                    <h2 class="font-bold">Create Student Account</h2>
                    <p class="text-muted text-sm">Join CampusBite for quick online canteen ordering</p>
                </div>

                <form onsubmit="handleRegisterSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="form-group">
                            <label class="form-label" for="reg-college-id">College ID</label>
                            <input type="text" id="reg-college-id" class="form-control" placeholder="e.g. CSE2026-042" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="reg-phone">Phone Number</label>
                            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 9876543210" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-email">College Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="student@college.edu" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="form-group">
                            <label class="form-label" for="reg-password">Password</label>
                            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 chars" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="reg-confirm">Confirm Password</label>
                            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
                        Create Account <i class="fas fa-user-plus ml-2"></i>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted text-sm">
                        Already registered? <a href="login.html" class="text-primary font-bold">Sign In Here</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        function handleRegisterSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const collegeId = document.getElementById('reg-college-id').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm').value;

            registerUser(name, collegeId, email, phone, password, confirmPassword);
        }
    </script>
</body>
</html>
