<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - CampusBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>
            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="cart.html" class="nav-link active">Cart</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth-buttons"></div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CART -->
    <main class="main-content py-5">
        <div class="container">
            <h1 class="font-bold mb-4"><i class="fas fa-shopping-basket text-primary mr-2"></i> Your Shopping Cart</h1>

            <div class="grid grid-cols-3 gap-4">
                <!-- Cart Items Container (2 cols) -->
                <div class="col-span-2" style="grid-column: span 2;" id="cart-items-container"></div>

                <!-- Cart Summary Sidebar (1 col) -->
                <div id="cart-summary-container"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CampusBite Canteen Management System.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
