<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CampusBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>
            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="cart.html" class="nav-link">Cart</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth-buttons"></div>
            </div>
        </div>
    </header>

    <!-- MAIN CHECKOUT -->
    <main class="main-content py-5">
        <div class="container">
            <h1 class="font-bold mb-4"><i class="fas fa-credit-card text-primary mr-2"></i> Checkout</h1>

            <form onsubmit="handleCheckoutSubmit(event)" class="grid grid-cols-3 gap-4">
                <!-- Left Details Column -->
                <div style="grid-column: span 2;">
                    <!-- Customer Information -->
                    <div class="card p-4 mb-4">
                        <h4 class="font-bold mb-3"><i class="fas fa-user-circle text-primary mr-2"></i> Customer Information</h4>
                        
                        <div class="form-group mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="checkout-name" class="form-control" required placeholder="e.g. Rahul Sharma">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="form-group mb-3">
                                <label class="form-label">College ID</label>
                                <input type="text" id="checkout-id" class="form-control" required placeholder="e.g. CSE2026-042">
                            </div>

                            <div class="form-group mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="checkout-phone" class="form-control" required placeholder="+91 9876543210">
                            </div>
                        </div>
                    </div>

                    <!-- Order Fulfillment Option -->
                    <div class="card p-4 mb-4">
                        <h4 class="font-bold mb-3"><i class="fas fa-store text-primary mr-2"></i> Fulfillment Option</h4>
                        <div class="p-3 border rounded bg-light d-flex align-center gap-3">
                            <input type="radio" name="pickup-method" value="Pickup from Canteen" checked id="pickup-canteen">
                            <label for="pickup-canteen" class="font-bold cursor-pointer flex-1">
                                Self Pickup from Campus Canteen Counter
                                <small class="text-muted d-block font-normal">Collect fresh food directly using your order ticket.</small>
                            </label>
                        </div>
                    </div>

                    <!-- Payment Option -->
                    <div class="card p-4">
                        <h4 class="font-bold mb-3"><i class="fas fa-wallet text-primary mr-2"></i> Select Payment Method</h4>
                        
                        <div class="form-group mb-3">
                            <div class="p-3 border rounded mb-2 d-flex align-center gap-3 cursor-pointer">
                                <input type="radio" name="payment-method" value="Cash at Counter" checked id="pay-cash">
                                <label for="pay-cash" class="font-semibold cursor-pointer flex-1">
                                    <i class="fas fa-money-bill-wave text-success mr-2"></i> Cash at Counter
                                    <small class="text-muted d-block">Pay cash when collecting your food at the counter.</small>
                                </label>
                            </div>

                            <div class="p-3 border rounded d-flex align-center gap-3 cursor-pointer">
                                <input type="radio" name="payment-method" value="UPI Demo" id="pay-upi">
                                <label for="pay-upi" class="font-semibold cursor-pointer flex-1">
                                    <i class="fas fa-mobile-alt text-primary mr-2"></i> UPI Demo (GPay / PhonePe / Paytm)
                                    <small class="text-muted d-block text-xs">* Educational demo payment mode (no real money charged).</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Summary Column -->
                <div>
                    <div class="card p-4">
                        <h4 class="font-bold mb-3">Order Summary</h4>
                        <div id="checkout-items-list" class="mb-3"></div>
                        
                        <div class="summary-breakdown py-2 border-top">
                            <div class="d-flex justify-between text-muted py-1">
                                <span>Subtotal</span>
                                <span id="checkout-subtotal">₹0</span>
                            </div>
                            <div class="d-flex justify-between text-muted py-1">
                                <span>Campus Tax (5%)</span>
                                <span id="checkout-tax">₹0</span>
                            </div>
                            <div class="d-flex justify-between font-bold text-lg py-2 border-top">
                                <span>Grand Total</span>
                                <span id="checkout-total" class="text-primary">₹0</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
                            <i class="fas fa-check-circle mr-2"></i> Place Order
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CampusBite Canteen Management System.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summary = getCartSummary();
            
            // Redirect if cart is empty
            if (summary.items.length === 0) {
                showToast("Cart is empty! Redirecting to menu...", "warning");
                setTimeout(() => window.location.href = 'menu.html', 1000);
                return;
            }

            // Autofill user info if logged in
            const currentUser = getStorage('currentUser', null);
            if (currentUser) {
                document.getElementById('checkout-name').value = currentUser.name || '';
                document.getElementById('checkout-id').value = currentUser.collegeId || '';
                document.getElementById('checkout-phone').value = currentUser.phone || '';
            }

            // Render summary breakdown
            let itemsHtml = '';
            summary.items.forEach(item => {
                itemsHtml += `
                    <div class="d-flex justify-between py-2 border-bottom text-sm">
                        <span>${item.quantity}x ${item.name}</span>
                        <span class="font-semibold">${formatCurrency(item.price * item.quantity)}</span>
                    </div>
                `;
            });

            document.getElementById('checkout-items-list').innerHTML = itemsHtml;
            document.getElementById('checkout-subtotal').textContent = formatCurrency(summary.subtotal);
            document.getElementById('checkout-tax').textContent = formatCurrency(summary.tax);
            document.getElementById('checkout-total').textContent = formatCurrency(summary.total);
        });

        function handleCheckoutSubmit(event) {
            event.preventDefault();
            const pickupMethod = document.querySelector('input[name="pickup-method"]:checked').value;
            const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;

            placeOrder(pickupMethod, paymentMethod);
        }
    </script>
</body>
</html>
