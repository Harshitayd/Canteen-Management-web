<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Menu - CampusBite Canteen</title>
    <meta name="description" content="Browse fresh snacks, meals, drinks and desserts available today at the campus canteen.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>

            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link active">Menu</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <a href="cart.html" class="cart-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth-buttons">
                    <a href="login.html" class="btn btn-outline mr-2">Login</a>
                    <a href="register.html" class="btn btn-primary">Register</a>
                </div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN MENU CONTENT -->
    <main class="main-content">
        <div class="container">
            <!-- Header Section -->
            <div class="text-center mb-4">
                <span class="badge badge-primary mb-2">Fresh & Hot</span>
                <h1 class="font-bold">Today's Menu</h1>
                <p class="text-muted">Explore items cooked fresh in the campus kitchen today.</p>
            </div>

            <!-- Search, Filters & Sorting Control Bar -->
            <div class="card p-4 mb-4">
                <div class="row align-center gap-3">
                    <!-- Search Bar -->
                    <div class="flex-1">
                        <div class="form-group mb-0" style="position: relative;">
                            <input type="text" class="form-control" placeholder="Search food..." oninput="handleSearchInput(this.value)">
                            <i class="fas fa-search" style="position: absolute; right: 15px; top: 14px; color: var(--text-muted);"></i>
                        </div>
                    </div>

                    <!-- Sort Options -->
                    <div style="min-width: 180px;">
                        <select class="form-control" onchange="handleSortChange(this.value)">
                            <option value="default">Sort by: Default</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Rating: High to Low</option>
                        </select>
                    </div>
                </div>

                <!-- Category Filters -->
                <div class="d-flex gap-2 mt-3 flex-wrap align-center">
                    <span class="font-semibold text-sm text-muted mr-2">Categories:</span>
                    <button class="btn btn-sm btn-outline category-btn active" onclick="setCategoryFilter('All', this)">All</button>
                    <button class="btn btn-sm btn-outline category-btn" onclick="setCategoryFilter('Breakfast', this)">Breakfast</button>
                    <button class="btn btn-sm btn-outline category-btn" onclick="setCategoryFilter('Lunch', this)">Lunch</button>
                    <button class="btn btn-sm btn-outline category-btn" onclick="setCategoryFilter('Snacks', this)">Snacks</button>
                    <button class="btn btn-sm btn-outline category-btn" onclick="setCategoryFilter('Beverages', this)">Beverages</button>
                    <button class="btn btn-sm btn-outline category-btn" onclick="setCategoryFilter('Desserts', this)">Desserts</button>
                </div>
            </div>

            <!-- Food Cards Container -->
            <div id="food-grid-container" class="food-grid"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CampusBite Canteen Management System. Designed as a 1st-Year CSE College Project.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
