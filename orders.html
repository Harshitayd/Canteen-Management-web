<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - CampusBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>
            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="orders.html" class="nav-link active">My Orders</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
                <div id="nav-auth-buttons"></div>
            </div>
        </div>
    </header>

    <!-- MAIN ORDERS -->
    <main class="main-content py-5">
        <div class="container">
            <div class="d-flex justify-between align-center mb-4">
                <div>
                    <h1 class="font-bold"><i class="fas fa-receipt text-primary mr-2"></i> Order History</h1>
                    <p class="text-muted">Track all your previous and active canteen orders.</p>
                </div>
                <a href="menu.html" class="btn btn-primary">
                    <i class="fas fa-plus mr-1"></i> New Order
                </a>
            </div>

            <!-- Filter Buttons -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <button class="btn btn-sm btn-outline order-filter-btn active" onclick="filterStudentOrders('All', this)">All Orders</button>
                <button class="btn btn-sm btn-outline order-filter-btn" onclick="filterStudentOrders('Pending', this)">Pending</button>
                <button class="btn btn-sm btn-outline order-filter-btn" onclick="filterStudentOrders('Preparing', this)">Preparing</button>
                <button class="btn btn-sm btn-outline order-filter-btn" onclick="filterStudentOrders('Ready', this)">Ready</button>
                <button class="btn btn-sm btn-outline order-filter-btn" onclick="filterStudentOrders('Completed', this)">Completed</button>
            </div>

            <!-- Student Orders Container -->
            <div id="student-orders-container"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CampusBite Canteen Management System.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
