<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - CampusBite Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- ADMIN SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <i class="fas fa-user-shield"></i>
                <span>Campus<strong>Admin</strong></span>
            </div>
            <ul class="admin-nav">
                <li class="admin-nav-item">
                    <a href="dashboard.html" class="admin-nav-link">
                        <i class="fas fa-th-large"></i> Dashboard
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a href="food.html" class="admin-nav-link">
                        <i class="fas fa-hamburger"></i> Food Items
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a href="orders.html" class="admin-nav-link active">
                        <i class="fas fa-clipboard-list"></i> Manage Orders
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a href="users.html" class="admin-nav-link">
                        <i class="fas fa-users"></i> Students List
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a href="reports.html" class="admin-nav-link">
                        <i class="fas fa-chart-line"></i> Sales Reports
                    </a>
                </li>
                <li class="admin-nav-item mt-4">
                    <a href="../index.html" class="admin-nav-link">
                        <i class="fas fa-globe"></i> View Website
                    </a>
                </li>
                <li class="admin-nav-item">
                    <button onclick="logoutUser()" class="admin-nav-link text-danger border-0 bg-transparent w-100 text-left">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </li>
            </ul>
        </aside>

        <!-- MAIN ORDER MANAGEMENT -->
        <main class="admin-main">
            <div class="admin-header">
                <div>
                    <h2 class="font-bold">Manage Canteen Orders</h2>
                    <p class="text-muted text-sm">Update status to notify student order tracking in real-time</p>
                </div>
            </div>

            <!-- Table Card Container -->
            <div class="card p-4">
                <div class="d-flex justify-between align-center mb-3">
                    <h4 class="font-bold">Active & Past Orders Table</h4>
                    <div class="d-flex gap-2">
                        <select class="form-control form-control-sm" onchange="adminOrderFilter = this.value; renderAdminOrdersTable();">
                            <option value="All">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Preparing">Preparing</option>
                            <option value="Ready">Ready for Pickup</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div id="admin-orders-table-container"></div>
            </div>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/orders.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
