<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - CampusBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-utensils"></i>
                <span>Campus<strong class="text-primary">Bite</strong></span>
            </a>
            <ul class="nav-menu" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="profile.html" class="nav-link active">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <div id="nav-auth-buttons"></div>
            </div>
        </div>
    </header>

    <!-- MAIN PROFILE -->
    <main class="main-content py-5">
        <div class="container">
            <div class="card p-4 mx-auto" style="max-width: 600px;">
                <div class="text-center mb-4 pb-3 border-bottom">
                    <i class="fas fa-user-circle text-primary mb-2" style="font-size: 3.5rem;"></i>
                    <h2 class="font-bold">Student Profile Details</h2>
                    <p class="text-muted text-sm">View and update your contact information</p>
                </div>

                <form onsubmit="saveStudentProfile(event)">
                    <div class="form-group mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" id="profile-name" class="form-control" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="form-group">
                            <label class="form-label">College ID (Read only)</label>
                            <input type="text" id="profile-id" class="form-control bg-light" readonly>
                        </div>

                        <div class="form-group">
                            <label class="form-label">College Email (Read only)</label>
                            <input type="email" id="profile-email" class="form-control bg-light" readonly>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="profile-phone" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        <i class="fas fa-save mr-2"></i> Save Profile Changes
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CampusBite Canteen Management System.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
